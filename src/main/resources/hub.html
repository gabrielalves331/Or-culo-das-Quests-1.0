<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hub da Guilda - O Oráculo das Quests</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=MedievalSharp&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#C5A028",
        backgroundDark: "#141316",
        accentRed: "#7a0000",
        gothic: "#1f1d22"
      },
      fontFamily: {
        display: ["Cinzel", "serif"],
        body: ["Spectral", "serif"],
        accent: ["MedievalSharp", "cursive"]
      }
    }
  }
}
</script>

<style>
.gothic-shadow {
  box-shadow: 0 12px 35px rgba(0,0,0,.85),
              inset 0 0 15px rgba(197,160,40,.08);
}

.card-hover:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 45px rgba(122,0,0,.35);
}

.glow-gold {
  text-shadow: 0 0 10px rgba(197,160,40,.4);
}
</style>
</head>

<body class="bg-backgroundDark text-stone-300 font-body min-h-screen overflow-x-hidden">

<!-- FUNDO -->
<div class="fixed inset-0 pointer-events-none opacity-30">
  <img class="w-full h-full object-cover grayscale sepia brightness-50 contrast-125"
       src="https://lh3.googleusercontent.com/aida-public/AB6AXuChRNU9zwmhRYmy4rIgqtrGWK5893gFaj2uuz0vcFhW6qLYvVI-tG6nvWI9ec0w1KtLBAjKIJ_qsYeDdcElCLel8D1SPG4mRq0vulwAoS11ZQxh0so-GtnPXuoEuC83lpnA8oobGd52WnT_xsBj6e6ej-otxCSDRpv-sSxcYjnaAjFgTG9emNrnon0uzt2KpOot1hUAmzGNl3mpaQoMjH1uEsYT6QJBa1Zynz83SAVrwweU9sDpQhIizXxxHkvaBXN7emhy7Obz0dg"/>
</div>

<div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-10">

<!-- HEADER -->
<header class="text-center mb-16 space-y-4">

  <p class="font-accent text-accentRed uppercase tracking-[0.3em] text-sm font-bold">
    O Oráculo das Quests
  </p>

  <h1 class="font-display text-5xl font-black text-primary glow-gold uppercase">
    Sala da Guilda
  </h1>

  <p class="italic text-stone-400">
    Bem-vindo, <span id="nome" class="text-primary font-semibold"></span>
  </p>

</header>

<main class="w-full overflow-x-auto">
  <div class="flex flex-nowrap justify-center gap-8 min-w-max px-4">

    <!-- ADICIONAR -->
    <button onclick="chamarJava('addMissao')"
     class="flex items-center gap-4 px-10 py-6 bg-gothic border border-primary/30 rounded-lg gothic-shadow hover:bg-primary/10 transition-all duration-300">
      <div class="flex items-center justify-center">
  <svg xmlns="http://www.w3.org/2000/svg"
     class="w-8 h-8 text-primary"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8">
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M4 4h10a4 4 0 014 4v12H8a4 4 0 00-4 4V4z"/>
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M8 2v4m4-4v4"/>
</svg>
    </div>
      <span class="font-display text-lg font-bold uppercase tracking-wider">Adicionar</span>
    </button>

    <!-- EDITAR -->
    <button onclick="chamarJava('editarMissao')"
     class="flex items-center gap-4 px-10 py-6 bg-gothic border border-primary/30 rounded-lg gothic-shadow hover:bg-primary/10 transition-all duration-300">
      <div class="flex items-center justify-center">
   <svg xmlns="http://www.w3.org/2000/svg"
     class="w-8 h-8 text-primary"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8">
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
</svg>
</div>
      <span class="font-display text-lg font-bold uppercase tracking-wider">Editar</span>
    </button>

    <!-- REMOVER -->
    <button onclick="chamarJava('removerMissao')"
     class="flex items-center gap-4 px-10 py-6 bg-gothic border border-accentRed/40 rounded-lg gothic-shadow hover:bg-accentRed/10 transition-all duration-300">
      <div class="flex items-center justify-center">
   <svg xmlns="http://www.w3.org/2000/svg"
     class="w-8 h-8 text-accentRed"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8">
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M6 7h12M9 7v10m6-10v10M10 4h4l1 3H9l1-3z"/>
</svg>
</div>
      <span class="font-display text-lg font-bold uppercase tracking-wider text-accentRed">Remover</span>
    </button>

    <!-- MURAL -->
    <button onclick="chamarJava('verMural')"
     class="flex items-center gap-4 px-10 py-6 bg-gothic border border-primary/30 rounded-lg gothic-shadow hover:bg-primary/10 transition-all duration-300">
      <div class="flex items-center justify-center">
   <svg xmlns="http://www.w3.org/2000/svg"
     class="w-8 h-8 text-primary"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8">
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M1.5 12s4-7 10.5-7 10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
  <circle cx="12" cy="12" r="3"/>
</svg>
</div>
      <span class="font-display text-lg font-bold uppercase tracking-wider">Mural</span>
    </button>

    <!-- REGISTRO -->
    <button onclick="chamarJava('verRegistro')"
     class="flex items-center gap-4 px-10 py-6 bg-gothic border border-primary/30 rounded-lg gothic-shadow hover:bg-primary/10 transition-all duration-300">
      <div class="flex items-center justify-center">
   <svg xmlns="http://www.w3.org/2000/svg"
     class="w-8 h-8 text-primary"
     fill="none"
     viewBox="0 0 24 24"
     stroke="currentColor"
     stroke-width="1.8">
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
  <path stroke-linecap="round" stroke-linejoin="round"
        d="M4 4h13a3 3 0 013 3v13H6.5A2.5 2.5 0 004 22V4z"/>
</svg>
</div>
      <span class="font-display text-lg font-bold uppercase tracking-wider">Livro de Registros</span>
    </button>

  </div>
</main>

<!-- FOOTER -->
<footer class="mt-20 text-xs tracking-widest uppercase text-stone-500 text-center space-y-4">

  <div class="flex items-center justify-center gap-2">
    <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
    <span>Mural Conectado ao Reino</span>
  </div>

  <button class="px-6 py-2 border border-primary/30 rounded hover:bg-primary/10 transition-colors"
          onclick="javaApp.logout()">
      Logout
  </button>

</footer>

</div>

<script>
function chamarJava(funcao) {
    if (typeof javaApp === "undefined") {
        alert("Conexão com o Oráculo ainda não foi estabelecida.");
        return;
    }

    if (typeof javaApp[funcao] !== "function") {
        alert("Função não encontrada no Oráculo: " + funcao);
        return;
    }

    javaApp[funcao]();
}

// Carregar nome do usuário ao iniciar
document.addEventListener("DOMContentLoaded", function() {
    if (typeof javaApp !== "undefined") {
        document.getElementById("nome").innerText = javaApp.getNomeUsuario();
    }
});
</script>

</body>
</html>
