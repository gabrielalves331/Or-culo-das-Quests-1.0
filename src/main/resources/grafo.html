<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>
#btnVoltar{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 18px;
    background:#3d2b1f;
    color:#d4c5a9;
    border:2px solid #c6a75e;
    font-family:"Cinzel", serif;
    cursor:pointer;
    z-index:999;
}
#btnVoltar:hover{ background:#5a3b28; }

#btnDFS{
    position:absolute;
    top:20px;
    right:20px;
    padding:10px 18px;
    background:#1f3d2b;
    color:#d4c5a9;
    border:2px solid #3ecf8e;
    font-family:"Cinzel", serif;
    cursor:pointer;
    z-index:999;
}
#btnDFS:hover{ background:#285a3d; }

#instrucao{
    position:absolute;
    top:70px;
    left:20px;
    color:#d4c5a9;
    font-family:"Cinzel";
    z-index:999;
}

body{
    margin:0;
    background:#0b0f14;
    color:#d4c5a9;
    font-family: "EB Garamond", serif;
}

#mynetwork{
    width:100%;
    height:100vh;
    border:8px solid #3d2b1f;
    background:#1e140d;
}

.mensagem {
    text-align:center;
    margin-top:50px;
    font-size:20px;
    color:gray;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">

</head>

<body>

<button id="btnVoltar" onclick="javaApp.voltar()">← Voltar</button>
<button id="btnDFS" onclick="executarDFS()">Executar DFS</button>

<div id="instrucao">
Clique esquerdo = início<br>
Clique direito = destino
</div>

<div id="mynetwork"></div>

<script>

let network;
let nodes;
let edges;

let inicio = null;
let destino = null;

function carregarGrafo(jsonString){

    let dados;

    try{
        dados = JSON.parse(jsonString);
    }catch(e){
        document.body.innerHTML =
        "<div class='mensagem'>Erro ao interpretar JSON.</div>";
        console.error(e);
        return;
    }

    const container = document.getElementById("mynetwork");

    nodes = new vis.DataSet(dados.nodes);
    edges = new vis.DataSet(dados.edges);

    const data = { nodes: nodes, edges: edges };

    const options = {

        nodes:{
            shape:"dot",
            size:20,
            font:{
                size:16,
                color:"#d4c5a9",
                face:"Cinzel"
            },
            borderWidth:2
        },

        edges:{
            arrows:{ to:{ enabled:true, scaleFactor:0.7 } },
            color:{ color:"#c6a75e" },
            smooth:{ type:"cubicBezier", forceDirection:"horizontal" }
        },

        groups:{
            usuario:{ color:{ background:"#7a1f1f", border:"#c6a75e" } },
            campanha:{ color:{ background:"#3d2b1f", border:"#c6a75e" } },
            missao:{ color:{ background:"#2c2e33", border:"#c6a75e" } }
        },

        physics:{
            hierarchicalRepulsion:{ nodeDistance:180 },
            solver:"hierarchicalRepulsion"
        },

        interaction:{
            zoomView:true,
            dragView:true
        }
    };

    network = new vis.Network(container, data, options);

    // clique esquerdo = INICIO
    network.on("click", function(params){

        if(params.nodes.length > 0){

            inicio = params.nodes[0];

            nodes.update({
                id: inicio,
                color:{
                    background:"#339af0",
                    border:"#1c7ed6"
                }
            });

            console.log("Inicio:", inicio);
        }

    });

    // clique direito = DESTINO
    network.on("oncontext", function(params){

        params.event.preventDefault();

        let nodeId = network.getNodeAt(params.pointer.DOM);

        if(nodeId){

            destino = nodeId;

            nodes.update({
                id: destino,
                color:{
                    background:"#ff6b6b",
                    border:"#c92a2a"
                }
            });

            console.log("Destino:", destino);
        }

    });

}

async function executarDFS(){

    if(!inicio || !destino){
        alert("Selecione um nó inicial e um destino.");
        return;
    }

    // evita lag
    network.stopSimulation();

    let resposta = javaApp.executarDFS(inicio, destino);
    let caminho = JSON.parse(resposta);

    if(caminho.length === 0){
        alert("Nenhum caminho encontrado.");
        return;
    }

    for(let id of caminho){

        // destaca nó
        nodes.update({
            id:id,
            color:{
                background:"#00ff88",
                border:"#00cc66"
            }
        });

        // animação de zoom
        network.focus(id, {
            scale:1.6,
            animation:{
                duration:1400,
                easingFunction:"easeInOutQuad"
            }
        });

        await new Promise(r => setTimeout(r, 900));
    }

}

</script>

</body>
</html>
