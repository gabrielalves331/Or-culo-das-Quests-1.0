<!DOCTYPE html>
<html>
    
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        #btnVoltar{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 18px;
    background:#3d2b1f;
    color:#d4c5a9;
    border:2px solid #c6a75e;
    font-family:"Cinzel", serif;
    cursor:pointer;
    z-index:999;
}

#btnVoltar:hover{
    background:#5a3b28;
}
        
       body{
    margin:0;
    background:#0b0f14;
    color:#d4c5a9;
    font-family: "EB Garamond", serif;
}

       #mynetwork{
    width:100%;
    height:100vh;
    border:8px solid #3d2b1f;
    background:#1e140d;
}

        .mensagem {
            text-align: center;
            margin-top: 50px;
            font-size: 20px;
            color: gray;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">

</head>

<body>
<button id="btnVoltar" onclick="javaApp.voltar()">
← Voltar
</button>
    
<div id="mynetwork"></div>

<script>
function carregarGrafo(jsonString){

    let dados;

    try{
        dados = JSON.parse(jsonString);
    }catch(e){
        document.body.innerHTML =
        "<div class='mensagem'>Erro ao interpretar JSON.</div>";
        console.error(e);
        return;
    }

    const container = document.getElementById("mynetwork");

    const data = {
        nodes: new vis.DataSet(dados.nodes),
        edges: new vis.DataSet(dados.edges)
    };

    const options = {
    nodes:{
        shape:"dot",
        size:20,
        font:{
            size:16,
            color:"#d4c5a9",
            face:"Cinzel"
        },
        borderWidth:2
    },

    edges:{
        arrows:{
            to:{
                enabled:true,
                scaleFactor:0.7
            }
        },
        color:{
            color:"#c6a75e"
        },
        smooth:{
            type:"cubicBezier",
            forceDirection:"horizontal"
        }
    },

    groups:{
        usuario:{ color:{ background:"#7a1f1f", border:"#c6a75e" } },
        campanha:{ color:{ background:"#3d2b1f", border:"#c6a75e" } },
        missao:{ color:{ background:"#2c2e33", border:"#c6a75e" } }
    },

    physics:{
        hierarchicalRepulsion:{ nodeDistance:180 },
        solver:"hierarchicalRepulsion"
    },

    interaction:{
        zoomView:true,
        dragView:true
    }
};

const network = new vis.Network(container, data, options);

network.on("selectNode", function(params){
    const node = params.nodes[0];
    console.log("Selecionado:", node);
});

}
</script>

</body>
</html>
