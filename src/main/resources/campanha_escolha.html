<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecionar Campanha</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300;400;700&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#c6a65d",
                background: "#0a0907",
                parchment: "#d9c5a3",
                stone: "#2a2824"
            },
            fontFamily: {
                display: ["Newsreader", "serif"]
            }
        }
    }
}
</script>

<style>
body {
    margin: 0;
    font-family: "Newsreader", serif;
    background: radial-gradient(circle at center, #2a1408 0%, #0d0702 70%);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ===== BASE ===== */
.scroll {
    position: relative;
    overflow: hidden;
    border-radius: 26px;
    transition: 0.4s ease;
}

/* ===== CARD CENTRAL ===== */
.scroll-center {
    width: 300px;
    height: 500px;
    transform: scale(1.08);
    background: linear-gradient(
        180deg,
        #e8c08f 0%,
        #e6bf8a 35%,
        #e1b27a 100%
    );
    box-shadow:
        0 0 50px rgba(60,110,255,0.35),
        0 30px 70px rgba(0,0,0,0.85);
}

/* Topo encaixado */
.scroll-center::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 36px;
    background: #5a3825;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
}

/* Base encaixada */
.scroll-center::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 8%;
    width: 84%;
    height: 32px;
    background: #5a3825;
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
}

/* Luz real do papel */
.inner-glow {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,0.35), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(0,0,0,0.08), transparent 70%);
    pointer-events: none;
}

/* ===== LATERAIS ===== */
.scroll-side {
    width: 220px;
    height: 380px;
    opacity: 0.75;
    background: linear-gradient(
        180deg,
        #d9b383,
        #c49a69
    );
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
}

.rotate-left { transform: rotate(-6deg) scale(0.9); }
.rotate-right { transform: rotate(6deg) scale(0.9); }

/* ===== TÍTULO ===== */
.titulo-campanha {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #2b2723;
}

/* Linha */
.linha {
    width: 60%;
    margin: 20px auto;
    border: none;
    border-top: 1px solid rgba(0,0,0,0.2);
}

/* Navegação */
.nav-svg {
    width: 70px;
    height: 70px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #c6a65d;
    transition: 0.3s ease;
}

.nav-svg:hover {
    color: white;
    transform: scale(1.15);
}

/* Botões inferiores */
.footer-buttons button {
    padding: 12px 28px;
    background: linear-gradient(145deg, #3a3834, #1a1917);
    border: 1px solid #4a4844;
    color: white;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: 0.2s;
}

.footer-buttons button:hover {
    border-color: #c6a65d;
    color: #c6a65d;
}
</style>
</head>

<body>

<div class="text-center mb-16">
    <h2 class="text-primary text-xl tracking-widest uppercase mb-4">Oráculo das Quests</h2>
    <h1 class="text-5xl italic font-display">Selecione sua Jornada</h1>
</div>

<div class="flex items-center gap-10">

<button onclick="anterior()" class="nav-svg">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="15 18 9 12 15 6"/>
</svg>
</button>

<div id="carrossel" class="flex items-end gap-12"></div>

<button onclick="proximo()" class="nav-svg">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="9 18 15 12 9 6"/>
</svg>
</button>

</div>

<div class="footer-buttons mt-20 flex gap-6 flex-wrap justify-center">
    <button onclick="javaApp.criarNova()">Criar Nova</button>
    <button onclick="entrar()">Entrar</button>
    <button onclick="excluir()">Excluir</button>
    <button onclick="javaApp.voltarlogin()">Voltar</button>
</div>

<script>
let campanhas = [];
let indexAtual = 0;

function render() {
    const container = document.getElementById("carrossel");
    container.innerHTML = "";
    if (!campanhas.length) return;

    const anteriorIndex = (indexAtual - 1 + campanhas.length) % campanhas.length;
    const proximoIndex = (indexAtual + 1) % campanhas.length;

    container.innerHTML += criarScroll(campanhas[anteriorIndex], "left");
    container.innerHTML += criarScroll(campanhas[indexAtual], "center");
    container.innerHTML += criarScroll(campanhas[proximoIndex], "right");
}

function criarScroll(campanha, posicao) {

    if (posicao === "center") {
        return `
        <div class="flex flex-col items-center">
            <div class="scroll scroll-center flex flex-col justify-center text-stone text-center px-10 relative">

                <div class="inner-glow"></div>

                <div>
                    <h3 class="titulo-campanha">
                        ${campanha.nome}
                    </h3>

                    <hr class="linha">

                    <p class="text-sm italic opacity-70">
                        Arquivo Arcano #${campanha.id}
                    </p>
                </div>

            </div>

            <p class="mt-6 text-blue-400 tracking-widest uppercase">
                Aventura Atual
            </p>
        </div>
        `;
    }

    return `
        <div class="scroll scroll-side ${posicao === "left" ? "rotate-left" : "rotate-right"} p-6 flex items-center justify-center text-stone text-center">
            <h3 class="italic font-bold">
                ${campanha.nome}
            </h3>
        </div>
    `;
}

function anterior() {
    if (!campanhas.length) return;
    indexAtual = (indexAtual - 1 + campanhas.length) % campanhas.length;
    render();
}

function proximo() {
    if (!campanhas.length) return;
    indexAtual = (indexAtual + 1) % campanhas.length;
    render();
}

function entrar() {
    if (!campanhas.length) return;
    javaApp.selecionarCampanha(campanhas[indexAtual].id);
}

function excluir() {
    if (!campanhas.length) return;
    if (!confirm("Deseja excluir esta campanha?")) return;
    javaApp.excluirCampanha(campanhas[indexAtual].id);
}

function carregarCampanhas(lista) {
    campanhas = lista || [];
    indexAtual = 0;
    render();
}
</script>

</body>
</html>
