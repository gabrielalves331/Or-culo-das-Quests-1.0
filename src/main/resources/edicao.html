<!DOCTYPE html>
<html class="dark" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crônicas da Missão - O Oráculo das Quests</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&amp;family=IM+Fell+English:ital@0;1&amp;family=MedievalSharp&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#8b1d1d", // Deep blood crimson
              "background-light": "#f4ece1",
              "background-dark": "#0a0a0c",
            },
            fontFamily: {
              display: ["Cinzel", "serif"],
              serif: ["IM Fell English", "serif"],
              gothic: ["MedievalSharp", "cursive"],
            },
            borderRadius: {
              DEFAULT: "4px",
            },
            backgroundImage: {
              'paper-texture': "url('https://www.transparenttextures.com/patterns/handmade-paper.png')",
              'leather-texture': "url('https://www.transparenttextures.com/patterns/dark-leather.png')",
            }
          },
        },
      };
    </script>
<style>
        .book-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }
        .vignette {
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
        }
        .candle-glow {
            background: radial-gradient(circle at 80% 20%, rgba(255, 170, 50, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .ink-text {
            color: #2c2825;
            mix-blend-mode: multiply;
        }
        .metallic-seal {
            background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 50%, #1a1a1a 100%);
            border: 2px solid #5a5a5a;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        .metallic-seal:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }
        .metallic-seal:active {
            transform: translateY(1px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .page-curl {
            position: relative;
        }
        .page-curl::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 100%);
        }
    </style>
</head>
<body class="bg-background-dark min-h-screen flex items-center justify-center overflow-hidden selection:bg-primary selection:text-white">
<div class="fixed inset-0 vignette z-10"></div>
<div class="fixed inset-0 candle-glow z-10"></div>
<div class="fixed inset-0 bg-stone-950 opacity-90 -z-10">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover opacity-20 mix-blend-overlay"></div>
</div>
<main class="relative z-20 w-full max-w-5xl px-8 flex flex-col items-center">
<header class="mb-12 text-center">
<h1 class="font-display text-4xl text-primary tracking-widest drop-shadow-[0_2px_10px_rgba(139,29,29,0.5)]">
                CRÔNICAS DA MISSÃO
            </h1>
</header>
<div class="relative w-full aspect-[1.4/1] bg-[#3d2b1f] rounded-lg p-3 book-shadow border-4 border-[#2d1e15] shadow-inner overflow-hidden">
<div class="absolute inset-0 bg-leather-texture opacity-60 pointer-events-none"></div>
<div class="relative w-full h-full bg-[#e8dab5] rounded-sm p-12 flex flex-col gap-8 shadow-inner overflow-hidden page-curl">
<div class="absolute inset-0 bg-paper-texture opacity-40 pointer-events-none"></div>
<div class="absolute left-1/2 top-0 bottom-0 w-16 -ml-8 bg-gradient-to-r from-transparent via-black/10 to-transparent pointer-events-none"></div>
<div class="relative z-10">
<label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest" for="mission-title">Título da Jornada</label>
<input class="w-full bg-transparent border-none focus:ring-0 font-serif text-5xl ink-text p-0 italic leading-tight placeholder-stone-400" id="mission-title" placeholder="O nome da lenda..." type="text" value=""/>
<div class="w-full h-px bg-stone-400/30 mt-1"></div>
</div>
<div class="relative z-10 flex-grow">
    <!-- Seção de Configurações da Missão -->
<div class="relative z-10 grid grid-cols-3 gap-8 mt-6">

    <!-- Dificuldade -->
    <div>
        <label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest">
            Dificuldade
        </label>
        <select id="mission-difficulty"
            class="w-full bg-transparent border border-stone-500/40 
                   font-serif text-xl ink-text 
                   focus:ring-0 focus:border-primary">
            <option value="facil">Fácil</option>
            <option value="medio">Médio</option>
            <option value="dificil">Difícil</option>
        </select>
    </div>

    <!-- Origem -->
    <div>
        <label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest">
            Origem
        </label>
        <select id="mission-origin"
            class="w-full bg-transparent border border-stone-500/40 
                   font-serif text-xl ink-text 
                   focus:ring-0 focus:border-primary">
            <option value="REAL">Coroa Real</option>
            <option value="GUILDA">Guilda</option>
            <option value="IGREJA">Igreja</option>
            <option value="MAGOS">Conclave Arcano</option>
            <option value="POPULAR">Povo</option>
        </select>
    </div>

    <!-- Recompensa -->
    <div>
        <label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest">
            Recompensa
        </label>
        <input id="mission-reward"
            type="text"
            placeholder="Ex: 300 moedas"
            class="w-full bg-transparent border border-stone-500/40 
                   font-serif text-xl ink-text 
                   focus:ring-0 focus:border-primary"/>
    </div>
    
    <!-- Status -->
<div>
    <label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest">
        Estado
    </label>
    <select id="mission-status"
        class="w-full bg-transparent border border-stone-500/40 
               font-serif text-xl ink-text 
               focus:ring-0 focus:border-primary">
        <option value="PENDENTE">Pendente</option>
        <option value="CONCLUIDA">Concluída</option>
    </select>
</div>

</div>

<label class="block font-gothic text-xs text-stone-600 uppercase mb-2 tracking-widest" for="mission-desc">O Relato do Oráculo</label>

<textarea class="w-full h-full bg-transparent border-none focus:ring-0 font-serif text-2xl ink-text p-0 resize-none leading-relaxed placeholder-stone-400" id="mission-desc" placeholder="Escreva aqui os detalhes da missão...">
    
</textarea>

</div>
<div class="absolute bottom-6 left-12 right-12 flex justify-between items-center border-t border-stone-400/20 pt-4 pointer-events-none opacity-40">
<span class="font-serif italic text-sm text-stone-600">Página de Destino</span>
</div>
</div>
</div>
<div class="flex gap-8 mt-16">
<button class="metallic-seal px-12 py-3 rounded-full"
        onclick="salvar()">
    <span class="font-display font-bold text-stone-200 tracking-[0.2em] uppercase text-sm">
        Salvar
    </span>
</button>

<button class="metallic-seal px-12 py-3 rounded-full flex items-center gap-3 group opacity-80 hover:opacity-100"  type="button" onclick="javaApp.voltarEdicaoescolhaWeb()">
<span class="font-display font-bold text-stone-200 tracking-[0.2em] uppercase text-sm">Cancelar</span>
</button>
</div>

</main>
<div class="fixed inset-0 pointer-events-none z-30">
<div class="absolute top-1/4 left-1/4 w-1 h-1 bg-amber-200 rounded-full blur-sm animate-pulse"></div>
<div class="absolute bottom-1/3 right-1/4 w-1 h-1 bg-amber-100 rounded-full blur-sm animate-pulse opacity-50"></div>
</div>

<script>
function carregarMissao(m) {
    document.getElementById("mission-title").value = m.titulo;
    document.getElementById("mission-desc").value = m.descricao;

    document.getElementById("mission-difficulty").value = m.dificuldade;
    document.getElementById("mission-reward").value = m.recompensa;
    document.getElementById("mission-origin").value = m.origem;
    document.getElementById("mission-status").value = m.status;
    
}

</script>

<script>
function salvar() {

    const titulo = document.getElementById("mission-title").value;
    const descricao = document.getElementById("mission-desc").value;
    const dificuldade = document.getElementById("mission-difficulty").value;
    const recompensa = document.getElementById("mission-reward").value;
    const origem = document.getElementById("mission-origin").value;
    const status = document.getElementById("mission-status").value;

    javaApp.salvarMissao(
        titulo,
        descricao,
        dificuldade,
        recompensa,
        origem,
        status
    );
}

</script>



</body></html>
