<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>O Oráculo das Quests - Grimório em Branco</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@300;400;600;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
    darkMode: "class",
    theme: {
        extend: {
            colors: {
                primary: "#c6a65d",
                background: "#0b0f14"
            },
            fontFamily: {
                display: ["Newsreader", "serif"]
            }
        }
    }
}
</script>

<style>
body {
    font-family: 'Newsreader', serif;
    background: radial-gradient(circle at center, #1a0a0a 0%, #0b0f14 100%);
    min-height: 100vh;
    color: #f8f7f6;
}
.wooden-frame {
    box-shadow: inset 0 0 100px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.9);
    border: 10px solid #2a1b0e;
}
.arcane-glow {
    text-shadow: 0 0 15px rgba(198, 166, 93, 0.5);
}
.button-glow {
    box-shadow: 0 0 20px rgba(198, 166, 93, 0.2);
    transition: all 0.3s ease;
}
.button-glow:hover {
    box-shadow: 0 0 30px rgba(198, 166, 93, 0.4);
    transform: translateY(-2px);
}
</style>
</head>

<body class="flex items-center justify-center p-6">

<div class="wooden-frame w-full max-w-4xl bg-[#120c08] rounded-lg p-12 md:p-20 flex flex-col items-center text-center relative overflow-hidden">

    <!-- Ícone central -->
    <div class="mb-12">
        <span class="material-symbols-outlined text-[140px] text-primary/20">
            ✨
        </span>
    </div>

    <!-- Texto -->
    <div class="max-w-2xl space-y-6">
        <h2 class="text-4xl md:text-5xl font-bold text-primary arcane-glow tracking-tight font-display">
            O Grimório Está em Branco…
        </h2>

        <p class="text-lg md:text-xl text-[#b3aea2] leading-relaxed italic">
            Nenhum mundo foi invocado até o momento.
            Crie uma campanha e comece a registrar suas lendas no Oráculo.
        </p>
    </div>

    <!-- Botão -->
    <div class="mt-16 flex flex-col items-center gap-6">

        <button onclick="javaApp.criarCampanha()"
                class="button-glow bg-[#2c3338] border border-primary/40 text-primary px-10 py-5 rounded-lg flex items-center gap-4 uppercase font-bold tracking-widest">
            ✨ Invocar Nova Campanha ✨
            
        </button>

        <!-- Opcional -->
        <button onclick="javaApp.voltar()"
                class="text-primary/50 hover:text-primary uppercase tracking-widest text-sm">
            &#10094; Voltar
        </button>

    </div>

</div>

</body>
</html>
